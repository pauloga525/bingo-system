name: Frontend (CI/CD)

# CI: en cada cambio de frontend/ revisa el formato y compila el panel.
# CD: al llegar a main, sube el panel compilado a HostGator por FTP (consultas.uets.edu.ec),
#     igual que sistema-solicitudes-migration-Front (academico.uets.edu.ec).
#
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER   (p. ej. uets.edu.ec)
#              FTP_USERNAME (cuenta FTP que entra directamente en
#                            public_html/website_9a02b4bd, la carpeta de consultas.uets.edu.ec)
#              FTP_PASSWORD
# La dirección del servidor Python (API_URL) está fija más abajo, en el job deploy.
#   Variables: FTP_SERVER_DIR (opcional, por defecto ./ = la carpeta raíz de la cuenta FTP)
#              GOOGLE_CLIENT_ID, FRONTEND_BASE_HREF (opcionales)
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Evita dos despliegues a la vez sobre la misma carpeta.
concurrency:
  group: deploy-hostgator-consultas
  cancel-in-progress: false

jobs:
  build:
    name: Compilar panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Formato (prettier)
        run: npx prettier --check src
      - name: Compilar
        env:
          # "/" porque el panel va en la raíz de consultas.uets.edu.ec.
          BASE_HREF: ${{ vars.FRONTEND_BASE_HREF || '/' }}
        run: npx ng build --base-href "$BASE_HREF"
      - name: Guardar el compilado
        uses: actions/upload-artifact@v4
        with:
          name: panel-compilado
          path: frontend/dist/gestor-usrs-bingo-angular/browser/
          include-hidden-files: true # incluye .htaccess
          retention-days: 7

  deploy:
    name: Desplegar en HostGator
    needs: build
    # Solo despliega con push a main (o lanzado a mano), nunca desde un PR.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: hostgator
    env:
      DEPLOY_DIR: ${{ vars.FTP_SERVER_DIR || './' }}
      # Servidor Python (backend) detrás de nginx con HTTPS en dbservertest01.
      API_URL: https://bingo.190-15-143-91.nip.io
    steps:
      - name: Descargar el compilado
        uses: actions/download-artifact@v4
        with:
          name: panel-compilado
          path: panel

      - name: Revisar configuración
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          faltan=""
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD API_URL; do
            [ -n "${!v}" ] || faltan="$faltan $v"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en GitHub:$faltan (ver frontend/README.md, sección Despliegue)"
            exit 1
          fi
          case "$DEPLOY_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR debe terminar en '/' (p. ej. ./)"; exit 1 ;;
          esac
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::API_URL debe empezar con https:// (el panel en HostGator usa HTTPS)"; exit 1 ;;
          esac

      # Protección: si la carpeta de destino ya tiene otro sitio (un index.html sin la marca
      # del panel), no se sube nada. Evita pisar, por ejemplo, academico.uets.edu.ec si se
      # reutilizan aquí los secretos FTP de otro proyecto.
      - name: Verificar que la carpeta es la del panel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          host="${FTP_SERVER#ftp://}"; host="${host%%/*}"; host="${host%%:*}"
          netrc="$RUNNER_TEMP/netrc"
          printf 'machine %s login %s password %s\n' "$host" "$FTP_USERNAME" "$FTP_PASSWORD" > "$netrc"
          chmod 600 "$netrc"
          dir="${DEPLOY_DIR#./}"
          if ! listado=$(curl -sS --netrc-file "$netrc" --list-only --max-time 60 "ftp://$host/$dir"); then
            rm -f "$netrc"
            echo "::error::No se pudo conectar al FTP o listar la carpeta '$DEPLOY_DIR' (revise FTP_SERVER, usuario y contraseña)"
            exit 1
          fi
          rm -f "$netrc"
          echo "Archivos actuales en la carpeta de destino: $(echo "$listado" | grep -c . || true)"
          if echo "$listado" | grep -qx 'index.html' && ! echo "$listado" | grep -qx 'bingo-panel.txt'; then
            echo "::error::La carpeta de destino ya tiene otro sitio (index.html sin bingo-panel.txt). Use una cuenta FTP que entre en public_html/website_9a02b4bd (consultas.uets.edu.ec)."
            exit 1
          fi

      - name: Generar env.js de producción
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const actual = fs.readFileSync("panel/env.js", "utf8");
            const idActual = (actual.match(/GOOGLE_CLIENT_ID:\s*["\x27]([^"\x27]+)/) || [])[1] || "";
            const env = {
              API_URL: process.env.API_URL.trim().replace(/\/+$/, ""),
              GOOGLE_CLIENT_ID: (process.env.GOOGLE_CLIENT_ID || idActual).trim(),
            };
            fs.writeFileSync(
              "panel/env.js",
              "// Generado por GitHub Actions al desplegar. Se puede editar en el servidor.\n" +
                "window.__env = " + JSON.stringify(env, null, 2) + ";\n",
            );
            console.log("API_URL =", env.API_URL);
          '

      - name: Subir por FTP a consultas.uets.edu.ec
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS falla en el canal de datos de HostGator (tlsv1 alert decode error),
          # igual que en sistema-solicitudes-migration-Front.
          protocol: ftp
          port: 21
          local-dir: ./panel/
          # La cuenta FTP entra directamente en
          # public_html/website_9a02b4bd (consultas.uets.edu.ec).
          server-dir: ${{ env.DEPLOY_DIR }}
