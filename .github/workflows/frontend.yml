name: Frontend (CI/CD)

# CI: en cada cambio de frontend/ revisa el formato y compila el panel.
# CD: al llegar a main, sube el panel compilado a HostGator por FTP.
#
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: API_URL        (obligatoria, dirección HTTPS del servidor Python)
#              FTP_SERVER_DIR (opcional; por defecto public_html/website_9a02b4bd/, carpeta del panel
#                              en HostGator vista desde la cuenta FTP principal)
#              GOOGLE_CLIENT_ID, FRONTEND_BASE_HREF, FTP_PORT (opcionales)
#   FTP_SERVER es el nombre del servidor de HostGator (gatorNNNN.hostgator.com), no el dominio.
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez; uno nuevo espera a que termine el anterior.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Formato (prettier)
        run: npx prettier --check src
      - name: Compilar
        env:
          # "/" si el panel va en la raíz del dominio; "/bingo/" si va en una subcarpeta.
          BASE_HREF: ${{ vars.FRONTEND_BASE_HREF || '/' }}
        run: npx ng build --base-href "$BASE_HREF"
      - name: Guardar el compilado
        uses: actions/upload-artifact@v4
        with:
          name: panel-compilado
          path: frontend/dist/gestor-usrs-bingo-angular/browser/
          include-hidden-files: true # incluye .htaccess
          retention-days: 7

  deploy:
    name: Desplegar en HostGator
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: hostgator
    env:
      # Carpeta del panel en HostGator, relativa a la raíz de la cuenta FTP (termina en "/").
      DEPLOY_DIR: ${{ vars.FTP_SERVER_DIR || 'public_html/website_9a02b4bd/' }}
    steps:
      - name: Descargar el compilado
        uses: actions/download-artifact@v4
        with:
          name: panel-compilado
          path: panel

      - name: Revisar configuración
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          API_URL: ${{ vars.API_URL }}
        run: |
          faltan=""
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD API_URL; do
            [ -n "${!v}" ] || faltan="$faltan $v"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en GitHub:$faltan (ver frontend/README.md, sección Despliegue)"
            exit 1
          fi
          echo "Destino: $DEPLOY_DIR"
          case "$DEPLOY_DIR" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR debe terminar en '/' (p. ej. public_html/)"; exit 1 ;;
          esac
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::API_URL debe empezar con https:// (el panel en HostGator usa HTTPS)"; exit 1 ;;
          esac

      - name: Generar env.js de producción
        env:
          API_URL: ${{ vars.API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          node -e '
            const fs = require("fs");
            const actual = fs.readFileSync("panel/env.js", "utf8");
            const idActual = (actual.match(/GOOGLE_CLIENT_ID:\s*["\x27]([^"\x27]+)/) || [])[1] || "";
            const env = {
              API_URL: process.env.API_URL.trim().replace(/\/+$/, ""),
              GOOGLE_CLIENT_ID: (process.env.GOOGLE_CLIENT_ID || idActual).trim(),
            };
            fs.writeFileSync(
              "panel/env.js",
              "// Generado por GitHub Actions al desplegar. Se puede editar en el servidor.\n" +
                "window.__env = " + JSON.stringify(env, null, 2) + ";\n",
            );
            console.log("API_URL =", env.API_URL);
          '

      # lftp en lugar de FTP-Deploy-Action: esa acción corta el canal de datos TLS con el
      # Pure-FTPd de HostGator ("tlsv1 alert decode error"). Siempre FTPS con certificado
      # verificado: FTP_SERVER debe ser el nombre del servidor (gatorNNNN.hostgator.com),
      # porque el certificado del FTP de HostGator es *.hostgator.com.
      - name: Subir por FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          host="${FTP_SERVER#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="${host%%:*}"
          case "$host" in
            *.hostgator.com) ;;
            *) echo "::warning::FTP_SERVER no termina en .hostgator.com; el certificado probablemente no coincidirá (use gatorNNNN.hostgator.com, ver cPanel → Nombre del servidor)" ;;
          esac
          echo "Subiendo a $host:$FTP_PORT → $DEPLOY_DIR (FTPS, certificado verificado)"
          cd panel
          # Orden: primero todo menos index.html; luego index.html (así nunca apunta a archivos
          # que aún no subieron); al final se borran los .js/.css de versiones anteriores.
          lftp -u "$FTP_USERNAME" --env-password -p "$FTP_PORT" "$host" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set mirror:parallel-transfer-count 6
          mkdir -p -f "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          mirror -R --no-perms --verbose=1 --exclude-glob index.html . .
          put index.html
          mirror -R --no-perms --verbose=1 --delete --include-glob chunk-*.js --include-glob main-*.js --include-glob polyfills-*.js --include-glob styles-*.css . .
          bye
          EOF
