<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tablero del Bingo · Acceso</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#101422; color:#f5f6f8; font-family:"Space Grotesk",system-ui,sans-serif; }
  .card { background:#1a2034; border-radius:1rem; padding:2rem; width:100%; max-width:380px;
          box-shadow:0 10px 30px rgba(0,0,0,.4); text-align:center; }
  h1 { margin:0 0 .5rem; font-size:1.5rem; }
  p { color:#a0aec0; font-size:.95rem; margin:.25rem 0 1.25rem; }
  .error { background:rgba(239,68,68,.15); border:1px solid #ef4444; color:#fca5a5;
           padding:.75rem; border-radius:.5rem; font-size:.9rem; margin-bottom:1rem; }
  #google-btn { display:flex; justify-content:center; min-height:44px; }
</style>
</head>
<body>
<main class="card">
  <h1>Tablero del Bingo</h1>
  <p>Solo el administrador puede abrir el tablero del juego.<br/>
     Ingrese con su cuenta institucional o use el botón <strong>Tablero</strong> del panel.</p>
  <div id="error" class="error" {% if not error %}hidden{% endif %}>{{ error }}</div>
  {% if google_client_id %}
    <div id="google-btn"></div>
  {% else %}
    <div class="error">El inicio de sesión con Google no está configurado (GOOGLE_CLIENT_ID).</div>
  {% endif %}
</main>
<script>
  const NEXT = {{ next | tojson }};
  const CLIENT_ID = {{ google_client_id | tojson }};
  const errorBox = document.getElementById('error');

  function mostrarError(msg) {
    errorBox.textContent = msg;
    errorBox.hidden = false;
  }

  async function onCredential(resp) {
    try {
      const r = await fetch('/tablero/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: resp.credential, next: NEXT }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return mostrarError(data.message || 'No se pudo iniciar sesión.');
      window.location.href = data.next || '/';
    } catch (e) {
      mostrarError('No se pudo conectar con el servidor.');
    }
  }

  window.addEventListener('load', () => {
    if (!CLIENT_ID || !window.google) return;
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
    google.accounts.id.renderButton(document.getElementById('google-btn'), {
      theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'es',
    });
  });
</script>
</body>
</html>
