{# Sesión del tablero (solo administrador): botón para salir y redirección al login si la sesión vence. #}
<form method="post" action="/tablero/salir" style="position:fixed;top:12px;right:12px;z-index:50">
  <button type="submit" title="Cerrar la sesión del tablero"
          style="padding:6px 12px;border-radius:9999px;background:#e5e7eb;color:#111827;font:500 13px sans-serif;border:0;cursor:pointer">
    Salir
  </button>
</form>
